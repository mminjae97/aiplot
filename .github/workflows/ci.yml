name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; every main commit keeps its own result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AIPLOT_FAKE_LLM: '1'

jobs:
  schemas:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: schemas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: schemas/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: server
      - run: npm ci
      - run: npm test
      - run: npm run codegen
      # Committed generated files must match the schemas exactly.
      - name: Check generated files are up to date
        shell: bash
        run: |
          changes=$(git status --porcelain -- ../app/src/types ../server/aiplot/generated)
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff -- ../app/src/types ../server/aiplot/generated
            echo "::error::Generated files are stale. Run 'npm run codegen' in schemas/ and commit."
            exit 1
          fi

  app:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('app/node_modules/electron/package.json') }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Electron downloads its binary lazily; fetch it before the e2e timeout starts.
      - run: node node_modules/electron/install.js
      # e2e runs the real local server from server/.venv (fixture LLM, no GPU).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: server
      - run: uv sync --locked
        working-directory: server
      - run: npm run e2e

  server:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: server
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy aiplot tests
      - run: uv run pytest

  training:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: training
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy eval
      # Step 2 eval cases save into a temp DB through the app's card save (no model, no GPU).
      - run: uv run python eval/step2/check.py
      # Step 4 eval cases: the step 2 cases plus the episodes continuing them, and the rubric.
      - run: uv run python eval/step4/check_cases.py

  # Windows installer (§19, from unit 14): main pushes and manual runs only (a few minutes).
  installer:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: server
      - run: uv sync --locked
        working-directory: server
      - run: uv run pyinstaller aiplot-server.spec --noconfirm
        working-directory: server
      - run: npm ci
        working-directory: app
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('app/node_modules/electron/package.json') }}
      - run: node node_modules/electron/install.js
        working-directory: app
      - run: npm run dist
        working-directory: app
      # The packaged app starts its bundled server and saves a card (fixture LLM).
      - run: npx playwright test tests/e2e/packaged.spec.ts
        working-directory: app
        env:
          AIPLOT_E2E_PACKAGED: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: Aiplot-Setup
          path: app/dist/Aiplot-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
