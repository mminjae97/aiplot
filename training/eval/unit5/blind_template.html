<title>문장 블라인드 비교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a reading desk. Pair list on the left, two manuscripts side by side, verdict bar under them. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #1d2230;
  --muted: #5c6475;
  --line: #d9dde5;
  --accent: #2f4fb3;
  --accent-soft: #e6ebfa;
  --done: #2c7a4b;
  --font-text: "Gowun Batang", "Noto Serif KR", "Batang", serif;
  --font-ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171f; --surface: #1c2029; --ink: #e5e8ef; --muted: #9aa2b3; --line: #2e3442;
    --accent: #8ea6ff; --accent-soft: #252d48; --done: #6fcf97; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171f; --surface: #1c2029; --ink: #e5e8ef; --muted: #9aa2b3; --line: #2e3442;
  --accent: #8ea6ff; --accent-soft: #252d48; --done: #6fcf97; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
.progress { color: var(--muted); font-variant-numeric: tabular-nums; }
.notice { grid-column: 1 / -1; margin: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); }
nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
nav button {
  width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border: 1px solid transparent; border-radius: 6px; background: none;
  color: var(--ink); font: inherit; cursor: pointer;
}
nav button:hover { background: var(--surface); }
nav button[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
nav .state { font-size: 12px; color: var(--muted); }
nav .state.voted { color: var(--done); font-weight: 600; }
main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.brief { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }
.brief pre {
  margin: 0; white-space: pre-wrap; word-break: keep-all; font: inherit; line-height: 1.6;
  padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.texts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
article { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
article h2 { margin: 0; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; }
article h2 span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.manuscript { font-family: var(--font-text); font-size: 17px; line-height: 1.7; white-space: pre-wrap; word-break: keep-all; margin: 0; }
.verdict { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.verdict button {
  padding: 10px 18px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font: inherit; font-weight: 500; cursor: pointer;
}
.verdict button:hover { border-color: var(--accent); }
.verdict button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.verdict kbd { font-family: var(--font-ui); font-size: 12px; opacity: 0.7; margin-left: 6px; }
.note { display: flex; flex-direction: column; gap: 6px; }
.note textarea {
  width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; font: inherit;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
}
.status { min-height: 1.4em; color: var(--muted); font-size: 13px; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav ol { flex-direction: row; flex-wrap: wrap; }
  nav li { flex: 0 0 auto; }
  nav button { width: auto; }
  .texts { grid-template-columns: minmax(0, 1fr); }
}
</style>

<div class="wrap">
  <header>
    <h1>문장 블라인드 비교</h1>
    <span class="progress" id="progress"></span>
  </header>
  <p class="notice" id="notice">같은 지시로 쓴 글 두 편을 읽고 더 나은 쪽을 고르세요. 어느 쪽이 어떤 모델인지는 비교가 끝난 뒤에 공개돼요. 키보드: 1, 2, 0(비슷함).</p>
  <nav aria-label="비교 목록"><ol id="list"></ol></nav>
  <main>
    <section class="brief">
      <span class="label" id="kind"></span>
      <pre id="brief"></pre>
    </section>
    <div class="texts">
      <article><h2>1번 <span id="chars1"></span></h2><p class="manuscript" id="text1"></p></article>
      <article><h2>2번 <span id="chars2"></span></h2><p class="manuscript" id="text2"></p></article>
    </div>
    <div class="verdict" role="group" aria-label="더 나은 글">
      <button type="button" id="pick1" data-choice="1">1번이 낫다<kbd>1</kbd></button>
      <button type="button" id="pick0" data-choice="tie">비슷하다<kbd>0</kbd></button>
      <button type="button" id="pick2" data-choice="2">2번이 낫다<kbd>2</kbd></button>
    </div>
    <label class="note" for="note"><span class="label">메모 (선택)</span>
      <textarea id="note" placeholder="고른 이유, 눈에 띈 문제"></textarea>
    </label>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
</div>

<script id="pairs" type="application/json">__PAIRS__</script>
<script>
const pairs = JSON.parse(document.getElementById("pairs").textContent);
const votes = {};
let db = null;
let index = 0;
const $ = (id) => document.getElementById(id);

function charCount(text) { return [...text].length; }

function render() {
  const pair = pairs[index];
  $("kind").textContent = pair.kind;
  $("brief").textContent = pair.brief;
  $("text1").textContent = pair.texts[0];
  $("text2").textContent = pair.texts[1];
  $("chars1").textContent = charCount(pair.texts[0]) + "자";
  $("chars2").textContent = charCount(pair.texts[1]) + "자";
  const vote = votes[pair.id];
  for (const b of document.querySelectorAll(".verdict button")) {
    b.setAttribute("aria-pressed", String(vote?.choice === b.dataset.choice));
  }
  if (document.activeElement !== $("note")) $("note").value = vote?.note ?? "";
  const list = $("list");
  list.replaceChildren(...pairs.map((p, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-current", String(i === index));
    const name = document.createElement("span");
    name.textContent = p.title;
    const state = document.createElement("span");
    state.className = "state" + (votes[p.id] ? " voted" : "");
    state.textContent = votes[p.id] ? "완료" : "남음";
    b.append(name, state);
    b.addEventListener("click", () => { index = i; render(); });
    li.append(b);
    return li;
  }));
  const done = pairs.filter((p) => votes[p.id]).length;
  $("progress").textContent = `${done} / ${pairs.length} 완료`;
}

async function choose(choice) {
  const pair = pairs[index];
  const vote = { choice, note: $("note").value.trim(), at: new Date().toISOString() };
  votes[pair.id] = vote;
  render();
  if (!db) { $("status").textContent = "저장되지 않았어요. claude.ai에서 이 페이지를 열어야 선택이 남아요."; return; }
  try {
    await db.doc("votes/" + pair.id).set(vote);
    $("status").textContent = `${pair.title} 저장됨`;
    const next = pairs.findIndex((p, i) => i > index && !votes[p.id]);
    const first = pairs.findIndex((p) => !votes[p.id]);
    const target = next !== -1 ? next : first;
    if (target !== -1) { index = target; $("note").value = ""; render(); window.scrollTo({ top: 0 }); }
  } catch (e) {
    $("status").textContent = "저장하지 못했어요. 잠시 뒤 다시 골라 주세요. (" + (e?.code ?? "오류") + ")";
  }
}

for (const b of document.querySelectorAll(".verdict button")) {
  b.addEventListener("click", () => choose(b.dataset.choice));
}
document.addEventListener("keydown", (e) => {
  if (e.target === $("note")) return;
  if (e.key === "1") choose("1");
  else if (e.key === "2") choose("2");
  else if (e.key === "0") choose("tie");
});

render();
(async () => {
  try { db = (await window.claude?.use?.("db")) ?? null; } catch { db = null; }
  if (!db) { $("status").textContent = "저장소에 연결하지 못했어요. 선택이 남지 않아요."; return; }
  db.collection("votes").onSnapshot((snap) => {
    for (const d of snap.docs) votes[d.id] = d.data();
    const first = pairs.findIndex((p) => !votes[p.id]);
    if (first !== -1 && votes[pairs[index].id]) index = first;
    render();
  }, (e) => { $("status").textContent = "저장된 선택을 불러오지 못했어요. (" + e.code + ")"; });
})();
</script>
