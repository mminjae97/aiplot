# Role → model settings (§13). prompt = version of prompts/{role}/v{n}.md.
# Roles are added in the dev step that first uses them. Sampling and max_tokens are drafts
# until measured in step 1 unit 5. JSON roles run at low temperature.
roles:
  chat:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 2
    thinking: false
    # Unit 5: stops sentence and token loops (a Q5 chat looped to max_tokens without it).
    sampling: { presence_penalty: 1.5 }
    max_tokens: 512
  source:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 3
    thinking: true
    sampling: { temperature: 0.3 }
    max_tokens: 4096
  card:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 5
    thinking: true
    sampling: { temperature: 0.3 }
    # Unit 15: long thinking on part cards ran past 4096 (twice on one card). With ctx 8192
    # this leaves room for prompts up to ~3.39k tokens (measured up to ~3.33k).
    max_tokens: 4800
  # Step 2 (§9): max_tokens are drafts until the step 2 measurement.
  scene:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 1
    thinking: true
    sampling: { temperature: 0.3 }
    max_tokens: 4096
  pick:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 1
    thinking: true
    sampling: { temperature: 0.3 }
    # With 20 candidates the prompt is ~8.4k chars (est. ~6k tokens, unmeasured): ctx 8192 may
    # cut the reply before max_tokens does.
    max_tokens: 4096
