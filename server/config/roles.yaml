# Role → model settings (§13). prompt = version of prompts/{role}/v{n}.md.
# Roles are added in the dev step that first uses them. Sampling and max_tokens are drafts
# until measured in step 1 unit 5. JSON roles run at low temperature.
roles:
  chat:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 2
    thinking: false
    # Unit 5: stops sentence and token loops (a Q5 chat looped to max_tokens without it).
    sampling: { presence_penalty: 1.5 }
    max_tokens: 512
  source:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 3
    thinking: true
    sampling: { temperature: 0.3 }
    max_tokens: 4096
  card:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 5
    thinking: true
    sampling: { temperature: 0.3 }
    # Unit 15: long thinking on part cards ran past 4096 (twice on one card). With ctx 12288
    # this leaves room for prompts up to ~7.49k tokens (measured up to ~3.33k).
    max_tokens: 4800
  # Step 2 (§9): max_tokens are drafts until the step 2 measurement.
  scene:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 1
    thinking: true
    sampling: { temperature: 0.3 }
    max_tokens: 4096
  pick:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 1
    thinking: true
    sampling: { temperature: 0.3 }
    # Review of #131 (Q5, prompt v1, ctx 8192): system prompt 753 tokens; a 20-candidate user
    # turn 4890-4958 (llama-tokenize); prompt_tokens 5456-5959; completions 1055-2540; one
    # call truncated at ctx 8192. The 20 longest catalog candidates make ~7.57k prompt tokens:
    # 4096 still fits ctx 12288 (7.57k + 4096 = ~11.67k).
    max_tokens: 4096
