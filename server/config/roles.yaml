# Role → model settings (§13). prompt = version of prompts/{role}/v{n}.md.
# Roles are added in the dev step that first uses them. Sampling and max_tokens are drafts
# until measured in step 1 unit 5. JSON roles run at low temperature.
roles:
  chat:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 2
    thinking: false
    # Unit 5: stops sentence and token loops (a Q5 chat looped to max_tokens without it).
    sampling: { presence_penalty: 1.5 }
    max_tokens: 512
  source:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 3
    thinking: true
    sampling: { temperature: 0.3 }
    max_tokens: 4096
  card:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 5
    thinking: true
    sampling: { temperature: 0.3 }
    # Unit 15: long thinking on part cards ran past 4096 (twice on one card). With ctx 12288
    # this leaves room for prompts up to ~7.49k tokens (measured up to ~3.33k).
    max_tokens: 4800
  # Step 2 (§9). Run 1 (training/eval/step2, Q5, ctx 12288, q8_0 KV): no truncation.
  scene:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 3
    thinking: true
    sampling: { temperature: 0.3 }
    # System prompt v3 2153 tokens (llama-tokenize; v2 2241 and v1 2077 by llama-server
    # /tokenize). v2 runs 5-6, 10 episodes each: prompt_tokens ≤3015, completions ≤2897, total
    # ≤5813, ≤6 scenes. v1 run 1: prompt_tokens ≤2851, completions median 1317, max 3267. v3's
    # checks add ~103 completion tokens per scene: 6144 leaves room (≤~9.1k of ctx 12288).
    max_tokens: 6144
  pick:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 2
    thinking: true
    sampling: { temperature: 0.3 }
    # System prompt v2 1161 tokens (llama-server /tokenize; v1 1018 the same way, 981 by
    # llama-tokenize). v2 runs 5-6 (with scene v2), 21 + 22 scenes: prompt_tokens ≤6819,
    # completions ≤2477, total ≤8894. v1 run 1, 22 scenes:
    # prompt_tokens median 6178, max 6657, completions median 1389, max 2748, total ≤9192 (an
    # earlier draft truncated once at ctx 8192). The 20 longest catalog candidates make an
    # estimated ~7.84k prompt tokens: 4096 still fits ctx 12288 (~11.94k).
    max_tokens: 4096
