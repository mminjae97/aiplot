# Role → model settings (§13). prompt = version of prompts/{role}/v{n}.md.
# Roles are added in the dev step that first uses them. Sampling and max_tokens are drafts
# until measured in step 1 unit 5. JSON roles run at low temperature.
roles:
  chat:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 2
    thinking: false
    # Unit 5: stops sentence and token loops (a Q5 chat looped to max_tokens without it).
    sampling: { presence_penalty: 1.5 }
    max_tokens: 512
  source:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 3
    thinking: true
    sampling: { temperature: 0.3 }
    max_tokens: 4096
  card:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 5
    thinking: true
    sampling: { temperature: 0.3 }
    # Unit 15: long thinking on part cards ran past 4096 (twice on one card). With ctx 12288
    # this leaves room for prompts up to ~7.49k tokens (measured up to ~3.33k).
    max_tokens: 4800
  # Step 2 (§9). Run 1 (training/eval/step2, Q5, ctx 12288, q8_0 KV): no truncation.
  scene:
    profile: qwen3-8b-uncensor-q5km
    lora: null
    prompt: 5
    thinking: true
    sampling: { temperature: 0.3 }
    # System prompt v5 3418 tokens, v4 3243 (llama-tokenize; v3 2153, v2 2241 by llama-server
    # /tokenize). Runs 11-12 (v5, 41 devices main/sub/none per scene): prompts ≤4192 tokens,
    # completions ≤5554, total ≤9647; the step 2 device experiment (41 yes/no per stage, 4-5
    # stages) took up to 6685 completion tokens. 8000 keeps the total within ctx 12288.
    max_tokens: 8000
